apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
spec:
  schedule: "17 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly
              image: registry.example.test/shop/api:1.4.2
              command: ["node", "scripts/nightly.js"]
