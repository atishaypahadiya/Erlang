# Vale, run by scripts/docs/check.sh on README.md, docs/explanation.md and the
# generated docs/reference/. The style is .vale/styles/Erlang.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Erlang

# The generated reference quotes the source and its schemas as they stand,
# names in capitals included, and lays most of it out in tables.
[docs/reference/*.md]
Erlang.Name = NO
Erlang.Sentences = NO
