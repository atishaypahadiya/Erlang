# lychee, run by scripts/docs/check.sh on the same pages as Vale. A link
# passes only with a 2xx answer, after redirects; an anchor must exist on its
# page. CI passes GITHUB_TOKEN, so GitHub links are checked through its API.
include_fragments = "full"
accept = ["200..=299"]
max_redirects = 5
max_retries = 3
retry_wait_time = 4
timeout = 30
