# ERLANG's CI, under the rule shared with ITTEN and KERCKHOFFS: every push to
# main and every pull request, except those that change only Markdown, and
# every pushed v* tag (path filters are not applied to tag pushes). Also run
# by hand (workflow_dispatch), to give a release commit the five green runs
# the release gate needs (docs/CONTRACT.md, "Release gate").
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  # The trace harness (scripts/trace.sh): each trace form's twins against a
  # PostgreSQL container pinned by digest, on loopback, at low rate. No load.
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # The timed forms carry their own runs and starts (five after the
      # warm-up, as the relative timing rule needs).
      - run: scripts/trace.sh
      # Every trace report, for the release gate's comparison across runs
      # (scripts/compare-reports.js), as <form>/<twin>/report.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-reports
          path: dist/trace/**/report.json
          if-no-files-found: error
          retention-days: 30

  # The release gate, on a pushed v* tag only: the tagged commit's last five
  # completed CI runs are green, and their trace reports identical apart from
  # what a machine measures (scripts/release-gate.sh). The tag's own run is
  # left out.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/release-gate.sh "$GITHUB_SHA" --exclude-run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}

  # The load forms, listed for the load job's matrix.
  load-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      forms: ${{ steps.list.outputs.forms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        # L05 runs in its own job (load-long), so it is left out here.
        run: echo "forms=$(cd fixtures && find . -path '*/load/load.json' | sed -e 's|^\./||' -e 's|/load/load.json$||' | grep -vx 'L05-memory-growth' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # The load harness (scripts/load.sh): one form per runner, its twins on
  # loopback against a PostgreSQL container pinned by digest, driven by k6 at
  # a fixed arrival rate within the guard's caps. k6 is Grafana's release,
  # checked by SHA-256, run as a separate program.
  load:
    needs: load-forms
    if: needs.load-forms.outputs.forms != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        form: ${{ fromJSON(needs.load-forms.outputs.forms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install k6 v2.3.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tar.gz" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - run: scripts/load.sh "$FORM"
        env:
          FORM: ${{ matrix.form }}
          # Five pairs a form, the twins in alternating order: the relative
          # timing rule (docs/decisions.md, Q8) and the heap slope's spread.
          ERLANG_LOAD_PAIRS: 5

  # L05's load form alone, under the ci-long caps (lib/load-guard.js): its
  # 30 s heap steps would put it at the 1,200 s cap of a form's job.
  load-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install k6 v2.3.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tar.gz" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - run: scripts/load.sh "$FORM"
        env:
          FORM: L05-memory-growth
          ERLANG_LOAD_PROFILE: ci-long
          # Five pairs a form, the twins in alternating order: the relative
          # timing rule (docs/decisions.md, Q8) and the heap slope's spread.
          ERLANG_LOAD_PAIRS: 5
