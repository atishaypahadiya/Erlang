# ERLANG's CI, under the rule shared with ITTEN and KERCKHOFFS: every push to
# main and every pull request, except those that change only Markdown, and
# every pushed v* tag (path filters are not applied to tag pushes). Also run
# by hand (workflow_dispatch), to give a release commit the five green runs
# the release gate needs (docs/CONTRACT.md, "Release gate").
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix scripts/docs
      # The doc checks' tools (scripts/docs/check.sh), each checked by SHA-256.
      - name: Install Vale v3.26.0 and lychee v0.24.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vale.tar.gz" https://github.com/errata-ai/vale/releases/download/v3.26.0/vale_3.26.0_Linux_64-bit.tar.gz
          echo "22aa69a556558e4a9dfc63c17030777383d8d3c48dcdfad655fa98e839d666ed  $RUNNER_TEMP/vale.tar.gz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/doc-tools"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/doc-tools" vale
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/doc-tools" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/doc-tools" >> "$GITHUB_PATH"
      - run: npm test
        env:
          # A missing doc tool fails the run here rather than being skipped.
          ERLANG_DOCS_REQUIRED: 1
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

  # The trace harness (scripts/trace.sh): each trace form's twins against a
  # PostgreSQL container pinned by digest, on loopback, at low rate. No load.
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # The timed forms carry their own runs and starts (five after the
      # warm-up, as the relative timing rule needs).
      - run: scripts/trace.sh
      # Headroom: every load form's clean twin, one request at a time; its
      # main thread busy at most 0.2 of the time at each step's rate.
      - run: scripts/trace.sh --headroom
        if: always()
      # Every trace report, for the release gate's comparison across runs
      # (scripts/compare-reports.js), as <form>/<twin>/report.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-reports
          path: dist/trace/**/report.json
          if-no-files-found: error
          retention-days: 30
      # Diagnostics (the owner, 20 November 2026): what each twin measured
      # (raw.json, with every start's collections and database writes), its
      # log (every garbage collection) and the database server's log, for
      # the trace and headroom runs, so a one-off stall can be explained.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-diagnostics
          path: |
            dist/trace/**/raw.json
            dist/trace/**/twin.log
            dist/trace/postgres.log
            dist/headroom/**/headroom.json
            dist/headroom/**/twin.log
            dist/headroom/postgres.log
          if-no-files-found: warn
          retention-days: 30

  # The release gate, on a pushed v* tag only: the tagged commit's last five
  # completed CI runs are green, and their trace reports identical apart from
  # what a machine measures (scripts/release-gate.sh). The tag's own run is
  # left out.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: scripts/release-gate.sh "$GITHUB_SHA" --exclude-run "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}

  # The load forms, listed for the load job's matrix.
  load-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      forms: ${{ steps.list.outputs.forms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        # L05 runs in its own job (load-long), so it is left out here.
        run: echo "forms=$(cd fixtures && find . -path '*/load/load.json' | sed -e 's|^\./||' -e 's|/load/load.json$||' | grep -vx 'L05-memory-growth' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # The load harness (scripts/load.sh): one form per runner, its twins on
  # loopback against a PostgreSQL container pinned by digest, driven by k6 at
  # a fixed arrival rate within the guard's caps. k6 is Grafana's release,
  # checked by SHA-256, run as a separate program.
  load:
    needs: load-forms
    if: needs.load-forms.outputs.forms != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        form: ${{ fromJSON(needs.load-forms.outputs.forms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install k6 v2.3.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tar.gz" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - run: scripts/load.sh "$FORM"
        env:
          FORM: ${{ matrix.form }}
          # Five pairs a form, the twins in alternating order: the relative
          # timing rule (docs/decisions.md, Q8) and the heap slope's spread.
          ERLANG_LOAD_PAIRS: 5
      # Diagnostics: the run's raw.json, the twins' logs and the database
      # server's log (the form is in the paths; artifact names cannot hold
      # a slash, so the job's index names it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-diagnostics-${{ strategy.job-index }}
          path: |
            dist/load/**/raw.json
            dist/load/**/twin.log
            dist/load/postgres.log
          if-no-files-found: warn
          retention-days: 30

  # L05's load form alone, under the ci-long caps (lib/load-guard.js): its
  # 30 s heap steps would put it at the 1,200 s cap of a form's job.
  load-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Install k6 v2.3.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k6.tar.gz" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - run: scripts/load.sh "$FORM"
        env:
          FORM: L05-memory-growth
          ERLANG_LOAD_PROFILE: ci-long
          # Five pairs a form, the twins in alternating order: the relative
          # timing rule (docs/decisions.md, Q8) and the heap slope's spread.
          ERLANG_LOAD_PAIRS: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-long-diagnostics
          path: |
            dist/load/**/raw.json
            dist/load/**/twin.log
            dist/load/postgres.log
          if-no-files-found: warn
          retention-days: 30
